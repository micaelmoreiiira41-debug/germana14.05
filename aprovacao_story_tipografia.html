<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story Aprovacao - Tipografia Black</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0A0804;
      --cream: #F0E8D8;
      --gold: #DCAE83;
      --muted: rgba(240, 232, 216, 0.68);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050403;
      color: var(--cream);
      font-family: "DM Sans", Arial, sans-serif;
    }

    .story {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--black);
      isolation: isolate;
    }

    .photo {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: url("assets/aprovacao/exemplo_story_medica_clara.png");
      background-position: center;
      background-size: cover;
      filter: brightness(1.2) saturate(0.98) contrast(0.96);
      transform: scale(1.018);
    }

    .story::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(10, 8, 4, 0.94) 0%, rgba(10, 8, 4, 0.78) 38%, rgba(10, 8, 4, 0.18) 72%, rgba(10, 8, 4, 0.42) 100%),
        linear-gradient(180deg, rgba(10, 8, 4, 0.18) 0%, rgba(10, 8, 4, 0.06) 44%, rgba(10, 8, 4, 0.9) 100%);
      pointer-events: none;
    }

    .badge {
      position: absolute;
      z-index: 3;
      top: 82px;
      left: 118px;
      display: inline-flex;
      align-items: center;
      width: 431px;
      height: 112px;
      gap: 14px;
      padding: 0 30px;
      border: 1px solid rgba(220, 174, 131, 0.38);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(9, 8, 5, 0.88), rgba(3, 3, 3, 0.76));
      backdrop-filter: blur(18px) saturate(1.14);
      box-shadow: inset 0 1px 0 rgba(240, 232, 216, 0.1), 0 42px 114px rgba(0, 0, 0, 0.46);
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 52% 36%, #F0E8D8 0 17%, transparent 18%),
        linear-gradient(135deg, #DCAE83, #25170D 70%);
      border: 1px solid rgba(240, 232, 216, 0.24);
    }

    .badge-copy {
      display: grid;
      line-height: 1.05;
    }

    .name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 600;
      color: var(--cream);
    }

    .verified {
      display: inline-grid;
      place-items: center;
      width: 17px;
      height: 17px;
      color: #0A0804;
      font-size: 11px;
      font-weight: 700;
      border-radius: 50%;
      background: #D8B879;
    }

    .handle {
      margin-top: 4px;
      color: rgba(240, 232, 216, 0.58);
      font-size: 13px;
      font-weight: 400;
    }

    .copy {
      position: absolute;
      z-index: 3;
      left: 122px;
      bottom: 190px;
      width: 790px;
      max-width: 790px;
      text-align: left;
    }

    h1 {
      margin: 0;
      max-width: 790px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 96px;
      font-weight: 600;
      line-height: 0.92;
      letter-spacing: 0;
      color: var(--cream);
    }

    .alt-line {
      display: block;
      font-size: 92px;
      line-height: 0.93;
    }

    .accent {
      color: var(--gold);
      font-family: "Playfair Display", Georgia, serif;
      font-size: 96px;
      font-style: italic;
      font-weight: 500;
    }

    .rule {
      width: 124px;
      height: 1px;
      margin-top: 44px;
      background: rgba(220, 174, 131, 0.76);
    }
  </style>
</head>
<body>
  <article class="story">
    <div class="photo"></div>
    <div class="badge">
      <div class="avatar"></div>
      <div class="badge-copy">
        <div class="name">Dra.Germana Veloso <span class="verified">&#10003;</span></div>
        <div class="handle">carreira medica</div>
      </div>
    </div>
    <div class="copy">
      <h1>
        Medicas e medicos que continuam evoluindo
        <span class="alt-line">ampliam suas</span>
        <span class="accent">possibilidades profissionais.</span>
      </h1>
      <div class="rule"></div>
    </div>
  </article>
</body>
</html>
